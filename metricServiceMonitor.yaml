apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: python-demo-service-monitor
  namespace: monitoring

  labels:
    release: monitoring

spec:
  selector:
    matchLabels:
      app: python-demo-app

  namespaceSelector:
    matchNames:
    - myapp

  endpoints:
  - port: metrics
    path: /metrics
    interval: 15s